<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RuneAmp</title></head><body>
<header><div class="brand"><span class="logo">RA</span><div><h1>RuneAmp</h1><small>FROM CHIPTUNE TO LOSSLESS</small></div></div><div class="head-actions"><button id="theme">Современный вид</button><button id="rescan">Обновить библиотеку</button></div></header>
<main><section class="deck" aria-label="Проигрыватель"><div class="titlebar"><strong>RUNEAMP / PLAYER</strong><span id="format">READY</span></div>
<div class="display"><div class="readout"><div id="now">Выберите композицию</div><div class="clock"><strong id="time">00:00</strong><span id="duration"> / --:--</span></div><small id="status">Ожидание</small></div><canvas id="spectrum" width="200" height="80" aria-hidden="true"></canvas></div>
<input id="seek" type="range" min="0" max="1000" value="0" aria-label="Позиция воспроизведения" disabled>
<div class="transport"><button id="prev" title="Предыдущий">|◀</button><button id="play" title="Воспроизвести">▶</button><button id="pause" title="Пауза">Ⅱ</button><button id="stop" title="Стоп">■</button><button id="next" title="Следующий">▶|</button><button id="local">LOCAL</button><label>VOL <input id="volume" type="range" min="0" max="100" value="65"></label></div>
<div class="options"><label><input id="shuffle" type="checkbox"> SHUFFLE</label><label>REPEAT <select id="repeat"><option value="off">Выкл.</option><option value="all">Все</option><option value="one">Один</option></select></label><span id="queuecount">0 треков</span></div>
</section>
<div class="workspace"><section class="panel library"><div class="titlebar"><strong>МУЗЫКАЛЬНАЯ БИБЛИОТЕКА</strong><span id="libcount"></span></div><div class="tools"><input id="search" type="search" placeholder="Поиск по названию или пути"><select id="source"><option value="all">Все источники</option><option value="music">Каталог сервера</option><option value="uploads">Загрузки</option></select><button id="upload">Загрузить</button></div><div class="folders"><label>Каталог <select id="folder"><option value="">Все каталоги</option></select></label><button id="addAll">Добавить найденное</button></div><div id="library" class="tracks"></div></section>
<section class="panel queue"><div class="titlebar"><strong>PLAYLIST EDITOR</strong><span id="playlistcount"></span></div><div class="tools"><input id="playlistName" placeholder="Название плейлиста" maxlength="120"><button id="save">Сохранить</button></div><div class="tools"><select id="saved"><option value="">Плейлисты на сервере</option></select><button id="load">Открыть</button><button id="delete">Удалить</button></div><div id="queue" class="tracks"></div><div class="tools"><button id="clear">Очистить очередь</button><button id="remove">Удалить трек</button><button id="up">↑</button><button id="down">↓</button></div></section></div>
<div id="message" role="status"></div><footer>RuneAmp 0.1.0 · GPL-3.0 · AY / Tracker / Audio</footer>
</main><audio id="audio" preload="metadata"></audio><input id="uploadFiles" type="file" multiple hidden><input id="localFiles" type="file" multiple hidden accept=".mp3,.flac,.wav,.ogg,.opus,.m4a,.aac,.pt2,.pt3,.stp">
<script type="module" src="/src/main.ts"></script></body></html>
